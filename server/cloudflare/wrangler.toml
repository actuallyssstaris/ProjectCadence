name = "projectcadence-rooms"
main = "src/index.js"
compatibility_date = "2025-06-01"

# every room lives in one object; plenty for a small community and keeps it simple
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Rooms"

# the free plan only has SQLite-backed objects (we don't store anything anyway)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Rooms"]

# accounts and global scores
[[d1_databases]]
binding = "DB"
database_name = "projectcadence"
database_id = "4fbb1a13-7933-4478-a7d4-9548cd015b36"
